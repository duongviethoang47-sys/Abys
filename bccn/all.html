    <style>
        /* 1. CẤU HÌNH NỀN VÀ SAO (ĐỒNG BỘ TRANG CHỦ) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            color: white;
            background: #050505 url('https://images.unsplash.com/photo-1506318137071-a8e063b4b519?q=80&w=2070') fixed center/cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stars-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
            z-index: 0; pointer-events: none;
            opacity: 0.8; filter: brightness(2.5) contrast(1.2); 
            background-attachment: fixed;
            animation: intenseTwinkle 2.5s ease-in-out infinite;
        }

        @keyframes intenseTwinkle {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.9; }
        }

        /* 2. NAVBAR */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; height: 60px;
            background: rgba(26, 26, 26, 0.9); backdrop-filter: blur(10px);
            position: fixed; top: 0; width: 100%; z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-family: 'Permanent Marker', cursive;
            font-size: 24px;
            text-decoration: none;
            font-weight: normal;
            background: linear-gradient(90deg, #00d4ff, #00ff88, #00d4ff, #ff00ff, #00d4ff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientFlow 3s linear infinite;
            filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.8)) 
                   drop-shadow(0 0 15px rgba(0, 212, 255, 0.6))
                   drop-shadow(0 0 30px rgba(0, 212, 255, 0.4));
        }

        @keyframes gradientFlow {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        /* 3. NỘI DUNG CHƯƠNG (ẢNH TRUYỆN) */
        .chapter-container {
            position: relative; 
            z-index: 1;
            margin-top: 80px;
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0;
            line-height: 0;
            font-size: 0;
        }
    
        .chapter-container img {
            display: block;
            width: 100%;
            min-height: 300px; /* Hạ bớt min-height để tránh lỗi viewport giả lập khi lazy load */
            background: #0a0a0a; 
            opacity: 0; /* Ảnh ẩn mặc định để tạo hiệu ứng fade-in mượt */
            transition: opacity 0.6s ease-in-out;
            border: none;
            outline: none;
            margin: -1px 0 0 0;
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        }

        /* Khi ảnh được JS kích hoạt load xong */
        .chapter-container img.loaded {
            opacity: 1 !important;
            min-height: auto; 
        }

        /* 4. ĐIỀU HƯỚNG CHI TIẾT (SCI-FI STYLE) */
        .navigation {
            position: relative; z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 80px;
            padding: 80px 0 120px;
            width: 100%;
        }

        .nav-btn {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: 0.5s;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(0, 212, 255, 0.5);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3), inset 0 0 15px rgba(0, 212, 255, 0.3);
            animation: rotateRing 4s linear infinite;
        }

        .nav-btn::after {
            content: '';
            position: absolute;
            width: 115%;
            height: 115%;
            border: 2px dashed rgba(255, 0, 255, 0.4);
            border-radius: 50%;
            animation: rotateRingRev 10s linear infinite;
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotateRingRev {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        .btn-core {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            border: 1px solid rgba(0, 212, 255, 0.8);
            color: #00d4ff;
            font-size: 30px;
            text-shadow: 0 0 10px #00d4ff;
            transition: 0.4s;
        }

        .nav-btn:hover .btn-core {
            box-shadow: 0 0 30px #00d4ff, inset 0 0 20px #00d4ff;
            color: white;
            transform: scale(1.1);
        }

        .nav-btn:hover::before {
            border-color: #00d4ff;
            box-shadow: 0 0 40px #00d4ff;
        }

        .btn-label {
            position: absolute;
            bottom: -35px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #00d4ff;
            text-transform: uppercase;
            text-shadow: 0 0 5px #00d4ff;
        }

        .nav-hint {
            position: absolute;
            bottom: -60px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }

        #nextBtn::before { border-color: rgba(255, 0, 255, 0.5); box-shadow: 0 0 15px rgba(255, 0, 255, 0.3); }
        #nextBtn .btn-core { border-color: #ff00ff; color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
        #nextBtn:hover .btn-core { box-shadow: 0 0 30px #ff00ff, inset 0 0 20px #ff00ff; }
        #nextBtn .btn-label { color: #ff00ff; text-shadow: 0 0 5px #ff00ff; }

        .nav-btn.disabled {
            filter: grayscale(1);
            opacity: 0.2;
            pointer-events: none;
        }

        /* DROPDOWN */
        .dropdown { position: relative; display: inline-block; }

        .dropbtn {
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
            padding: 8px 16px;
            font-size: 14px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        .dropbtn:hover {
            border-color: #00d4ff;
            color: white;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .arrow-down { font-size: 10px; margin-left: 5px; color: #00d4ff; }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 45px;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(15px);
            min-width: 250px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            z-index: 2000;
            animation: slideDown 0.3s ease;
        }

        .dropdown-content::-webkit-scrollbar { width: 6px; }
        .dropdown-content::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        .dropdown-content::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 10px; box-shadow: 0 0 10px #00d4ff; }
        .dropdown-content::-webkit-scrollbar-thumb:hover { background: #00ff88; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-content a {
            color: #aaa;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 14px;
            transition: 0.2s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .dropdown-content a:hover {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            padding-left: 20px;
        }

        .dropdown-content a.active {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.05);
            font-weight: bold;
        }

        .show { display: block; }

        .dropdown-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(20, 20, 20, 0.98);
            backdrop-filter: blur(10px);
        }

        .all-chapter-special {
            color: #ff00ff !important;
            text-align: center;
            font-weight: bold;
            border: 1px solid rgba(255, 0, 255, 0.3) !important;
            margin: 8px;
            border-radius: 8px;
            background: rgba(255, 0, 255, 0.05);
            transition: all 0.3s ease !important;
            display: block;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .all-chapter-special:hover {
            background: rgba(255, 0, 255, 0.2) !important;
            color: white !important;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5), inset 0 0 10px rgba(255, 0, 255, 0.9);
            border-color: #ff00ff !important;
            transform: translateY(-2px);
        }

        <div class="btn-wrapper">
            <a href="#" class="nav-btn disabled" id="prevBtn">
                <div class="btn-core">⇜</div>
                <div class="btn-label"></div>
            </a>
            <span class="nav-hint"></span>
        </div>

        <div class="btn-wrapper">
            <a href="#" class="nav-btn disabled" id="nextBtn">
                <div class="btn-core">⇝</div>
                <div class="btn-label"></div>
            </a>
            <span class="nav-hint"></span>
        </div>

    <script>
        const storyTitle = "Vòng xoáy chị em";
        const storageKey = "readChapters_" + storyTitle;

        // 1. ĐÓNG MỞ DROPDOWN MENU
        function toggleDropdown() {
            const dropdown = document.getElementById("chapterDropdown");
            dropdown.classList.toggle("show");
            if (dropdown.classList.contains("show")) {
                const activeItem = dropdown.querySelector(".active");
                if (activeItem) {
                    activeItem.scrollIntoView({ block: "nearest" });
                }
            }
        }

        window.onclick = function(event) {
            if (!event.target.matches('.dropbtn')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        // 2. ĐIỀU HƯỚNG PHÍM TẮT
        document.addEventListener('keydown', function(event) {
            if (event.key === "ArrowLeft") {
                const prevBtn = document.getElementById('prevBtn');
                if (prevBtn && !prevBtn.classList.contains('disabled') && prevBtn.getAttribute('href')) {
                    window.location.href = prevBtn.getAttribute('href');
                }
            } else if (event.key === "ArrowRight") {
                const nextBtn = document.getElementById('nextBtn');
                if (nextBtn && !nextBtn.classList.contains('disabled') && nextBtn.getAttribute('href')) {
                    window.location.href = nextBtn.getAttribute('href');
                }
            } else if (event.key === "Home") {
                event.preventDefault();
                window.scrollTo({ top: 0, behavior: "smooth" });
            } else if (event.key === "End") {
                event.preventDefault();
                window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
            }
        });

        // 3. XỬ LÝ TOÀN BỘ LOGIC KHI TẢI TRANG
        document.addEventListener("DOMContentLoaded", function() {
            const images = document.querySelectorAll('#imagesContainer img');
            const scrollKey = "scrollPos_" + storyTitle + "_all_index"; // Lưu vị trí theo số thứ tự ảnh

            // Gán ID/Index cho từng ảnh để dễ theo dõi
            images.forEach((img, index) => {
                img.setAttribute('data-index', index);
            });

            // 1. KHÔI PHỤC VỊ TRÍ CUỘN CHUẨN XÁC THEO ẢNH
            try {
                const savedIndex = localStorage.getItem(scrollKey);
                if (savedIndex !== null) {
                    const targetIndex = parseInt(savedIndex);
                    const targetImg = images[targetIndex];

                    if (targetImg) {
                        // Kích hoạt cuộn ngay lập tức đến ảnh mục tiêu
                        targetImg.scrollIntoView({ block: "start" });

                        // Dự phòng: Cuộn lại sau 300ms và 800ms khi ảnh lazy load thực tế bung ra làm lệch dòng
                        setTimeout(() => targetImg.scrollIntoView({ block: "start" }), 300);
                        setTimeout(() => targetImg.scrollIntoView({ block: "start" }), 800);
                    }
                }
            } catch (e) {
                console.error("Không thể khôi phục vị trí cuộn:", e);
            }

            // 2. HIỂN THỊ ẢNH & KÍCH HOẠT FADE-IN
            images.forEach(img => {
                if (img.complete) {
                    img.classList.add('loaded');
                } else {
                    img.addEventListener('load', function() {
                        img.classList.add('loaded');
                    });
                    img.addEventListener('error', function() {
                        img.style.opacity = "0.5"; 
                        img.style.minHeight = "100px";
                        img.classList.add('loaded');
                    });
                }
            });

            // 3. THEO DÕI VÀ LƯU ẢNH ĐANG ĐỌC (Sử dụng IntersectionObserver tối ưu nhất hiện nay)
            if ('IntersectionObserver' in window) {
                const observerOptions = {
                    root: null,
                    rootMargin: '-10% 0px -70% 0px', // Tập trung vào vùng góc trên màn hình (nơi mắt đang đọc)
                    threshold: 0
                };

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const index = entry.target.getAttribute('data-index');
                            // Chỉ lưu nếu không phải ảnh đầu tiên sát đỉnh trang
                            if (parseInt(index) > 0) {
                                localStorage.setItem(scrollKey, index);
                            } else {
                                localStorage.removeItem(scrollKey);
                            }
                        }
                    });
                }, observerOptions);

                images.forEach(img => observer.observe(img));
            } else {
                // Phương án dự phòng (Fallback) nếu trình duyệt cũ không hỗ trợ Observer
                let scrollTimeout;
                window.addEventListener('scroll', function() {
                    clearTimeout(scrollTimeout);
                    scrollTimeout = setTimeout(function() {
                        let currentImgIndex = 0;
                        let minDistance = Infinity;

                        images.forEach((img, index) => {
                            const rect = img.getBoundingClientRect();
                            // Tìm ảnh gần đỉnh màn hình nhất
                            if (rect.top >= -100 && rect.top < minDistance) {
                                minDistance = rect.top;
                                currentImgIndex = index;
                            }
                        });

                        if (currentImgIndex > 0) {
                            localStorage.setItem(scrollKey, currentImgIndex);
                        } else {
                            localStorage.removeItem(scrollKey);
                        }
                    }, 200);
                });
            }

            // --- GIỮ NGUYÊN TOÀN BỘ LOGIC DI CHUYỂN CHƯƠNG VÀ DROPDOWN BÊN DƯỚI ---
            const match = window.location.pathname.match(/(\d+)\.html/);
            const currentChapterNum = match ? parseInt(match[1]) : NaN;
            const maxChapter = 215; 

            if (!isNaN(currentChapterNum)) {
                try {
                    let readChapters = JSON.parse(localStorage.getItem(storageKey)) || [];
                    if (!readChapters.includes(currentChapterNum)) {
                        readChapters.push(currentChapterNum);
                    }
                    localStorage.setItem(storageKey, JSON.stringify(readChapters));
                } catch (e) {}
            }

            let readList = [];
            try { readList = JSON.parse(localStorage.getItem(storageKey)) || []; } catch(e) {}

            const chapterContainer = document.getElementById('dynamic-chapters');
            if (chapterContainer) {
                let chapterHTML = "";
                for (let i = 1; i <= maxChapter; i++) {
                    const fileName = i + ".html";
                    if (i === currentChapterNum) {
                        chapterHTML += `<a href="${fileName}" class="active">Chương ${i}</a>\n`;
                    } else if (readList.includes(i)) {
                        chapterHTML += `<a href="${fileName}" style="color: #555555 !important;">Chương ${i}</a>\n`;
                    } else {
                        chapterHTML += `<a href="${fileName}">Chương ${i}</a>\n`;
                    }
                }
                chapterContainer.innerHTML = chapterHTML;
            }

            if (!isNaN(currentChapterNum)) {
                document.title = `${storyTitle}  (´｡•᎑•)っ  Chương ${currentChapterNum}`;
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');

                if (currentChapterNum > 1) {
                    prevBtn.href = (currentChapterNum - 1) + ".html";
                    prevBtn.classList.remove("disabled");
                } else {
                    prevBtn.removeAttribute("href");
                    prevBtn.classList.add("disabled"); 
                }

                if (currentChapterNum < maxChapter) {
                    nextBtn.href = (currentChapterNum + 1) + ".html";
                    nextBtn.classList.remove("disabled");
                } else {
                    nextBtn.removeAttribute("href");
                    nextBtn.classList.add("disabled"); 
                }
            }
        });
    </script>
